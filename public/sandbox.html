<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'unsafe-inline'; img-src https: data: blob:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';">
    <title>VoidTab Sandbox</title>
    <style>
        html,
        body,
        #root {
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            margin: 0;
            overflow: hidden;
            background: transparent;
        }

        body {
            color: var(--vt-text, #f8fafc);
            font: 12px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        input,
        select,
        textarea {
            color: inherit;
            font: inherit;
        }

        a {
            color: var(--vt-accent, #60a5fa);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script src="./assets/sandbox-page.js"></script>
</body>
</html>
